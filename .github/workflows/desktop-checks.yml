name: Desktop checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
      - run: npm ci
      - run: npm run build
      - name: Run JavaScript tests
        run: |
          npm test 2>&1 | Tee-Object -FilePath js-tests.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $details = (Get-Content -Raw js-tests.log) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=JavaScript test failure::$details"
          }
          exit $result
      - name: Install browser for UI regressions
        run: npx playwright install chromium
      - name: Sidebar UI regression
        timeout-minutes: 5
        run: npm run test:sidebar
      - name: MCP content UI regression
        timeout-minutes: 5
        run: npm run test:mcp:browser
      - run: npm run test:rust
      - run: npm run test:rust:fixture
      - name: Check Rust formatting
        run: node scripts/native.mjs cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check Rust and desktop bridge
        run: node scripts/native.mjs cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features test-fixture -- -D warnings
      - name: Upload browser regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-regressions
          path: |
            desktop/artifacts/sidebar
            desktop/artifacts/mcp-content
          if-no-files-found: ignore
