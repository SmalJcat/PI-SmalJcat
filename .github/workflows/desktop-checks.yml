name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    name: Linux core checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - run: npm ci --ignore-scripts
      - run: npm run check:cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloud-verification
          path: desktop/artifacts/verification/cloud/
          retention-days: 14
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
      - run: npm ci
      - name: Record Windows WebView2 environment
        run: |
          $directory = 'artifacts/verification/windows'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtimes = @($runtimeKeys | ForEach-Object {
            $value = Get-ItemProperty -LiteralPath $_ -ErrorAction SilentlyContinue
            if ($value.pv) { @{ registryPath = $_; version = $value.pv } }
          })
          $report = @{
            imageOS = $env:ImageOS; imageVersion = $env:ImageVersion
            osVersion = [Environment]::OSVersion.VersionString
            sessionId = (Get-Process -Id $PID).SessionId
            userInteractive = [Environment]::UserInteractive
            elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            webview2Runtimes = $runtimes
          }
          $json = $report | ConvertTo-Json -Depth 5
          $json | Set-Content -Encoding utf8 "$directory/webview2-environment.json"
          Write-Output $json
      - run: npm run check:windows
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-verification
          path: |
            desktop/artifacts/verification/windows/
            desktop/artifacts/tauri-ui-result.json
            desktop/artifacts/tauri-*.png
            desktop/artifacts/v04-*.png
            desktop/artifacts/scout-history-*.png
          retention-days: 14
