[package]
name = "pi-desktop"
version = "0.5.3"
description = "Native desktop workspace for Pi"
authors = ["Pi Desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
default-run = "pi-desktop"

[lib]
name = "pi_desktop"
path = "src/lib.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification"]
test-fixture = []
tauri-plugin-notification = ["dep:tauri-plugin-notification"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "6"
dunce = "1"
# 扩展签名校验（P1.1）：只用 verify 能力，关闭默认的 rand/零化特性，减少依赖面。
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "fs"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri-plugin-notification = { version = "2.8.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pi-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "pi-rpc-check"
path = "src/bin/pi-rpc-check.rs"

[[bin]]
name = "pi-workspace-check"
path = "src/bin/pi-workspace-check.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "pi-session-lease"
path = "src/bin/pi-session-lease.rs"
required-features = ["test-fixture"]
