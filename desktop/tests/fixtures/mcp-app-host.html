<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>MCP App host contract</title></head>
<body><div id="root"></div>
<script type="module">
import { mountMcpApp } from '/src/mcp-app-frame.mjs';
window.appHost = {calls:[],allow:false,allowResources:false,allowMessages:false,allowModelContext:false,hold:false,revision:0};
const rpc = async raw => {
  const message = JSON.parse(raw);
  window.appHost.calls.push(message);
  const reply = result => ({response:{jsonrpc:'2.0',id:message.id,result},notifications:[]});
  if (message.method === 'ui/initialize') return reply({hostContext:{}});
  if (message.method === 'ui/notifications/initialized') return {response:null,notifications:[
    {jsonrpc:'2.0',method:'ui/notifications/tool-input',params:{arguments:{count:7}}},
    {jsonrpc:'2.0',method:'ui/notifications/tool-result',params:{structuredContent:{count:7}}},
  ]};
  if (window.appHost.hold) await new Promise(resolve => { window.appHost.release=resolve; });
  if (message.method === 'tools/call' && window.appHost.allow) return reply({structuredContent:{count:42}});
  if (message.method === 'ui/message' && window.appHost.allowMessages) return reply({});
  if (message.method === 'ui/update-model-context' && window.appHost.allowModelContext) {
    window.appHost.modelContext=message.params;
    return reply({});
  }
  if (['resources/subscribe','resources/unsubscribe'].includes(message.method) && window.appHost.allowResources) return reply({});
  if (message.method === 'resources/read' && message.params.uri==='fixture://live' && window.appHost.allowResources) {
    return reply({contents:[{uri:'fixture://live',mimeType:'text/plain',text:'LIVE_BROWSER:'+window.appHost.revision}]});
  }
  if (message.method === 'resources/read' && window.appHost.allowResources) return reply({contents:[
    message.params.uri === 'fixture://binary'
      ? {uri:message.params.uri,mimeType:'application/octet-stream',blob:'AAEC'}
      : {uri:message.params.uri,mimeType:'text/plain',text:'你好🙂 browser resource'},
  ]});
  return {response:{jsonrpc:'2.0',id:message.id,error:{code:-32000,message:'denied'}},notifications:[]};
};
const url = new URL('/mcp-app-resource',location.href);
url.hostname = 'localhost';
window.addEventListener('message', event => {
  if (event.source === window.appController.frame.contentWindow && event.data?.id === 'host-teardown') {
    window.appHost.teardownAcknowledged=true;
  }
});
window.appController = mountMcpApp(document.getElementById('root'),
  {title:'App contract',server:'local fixture',uri:'ui://fixture/app'},url.href,rpc,()=>{});
window.appController.notify({jsonrpc:'2.0',method:'notifications/resources/list_changed'});
</script></body></html>
